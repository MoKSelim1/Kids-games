name: Deploy to GitHub Pages

# GitHub Pages serves this repo from the gh-pages branch; this workflow
# keeps gh-pages in sync with main so every merge goes live automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish main to gh-pages
        run: git push origin HEAD:gh-pages --force
